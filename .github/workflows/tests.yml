name: tests

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, development and observability dependencies
        run: python -m pip install -e ".[dev,observability]"
      - name: Run tests
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Smoke-test offline evaluation CLI
        run: |
          research-eval evaluation/datasets/smoke_report.json \
            --relevant-source-url https://example.org/primary
      - name: Validate benchmark template schema
        run: research-bench validate evaluation/datasets/benchmark_template.json
      - name: Validate ResearchBench candidate seed pack
        run: research-bench validate evaluation/datasets/benchmark_candidates_v0.2.json
      - name: Validate external benchmark registry
        run: research-external list
