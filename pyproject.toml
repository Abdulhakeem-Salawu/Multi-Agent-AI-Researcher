[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ai-researcher"
version = "0.1.0"
description = "An evidence-grounded multi-agent research system orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.2.24,<2.0.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "httpx>=0.27"]
benchmark = ["datasets>=3.0,<5.0"]
cloud = ["modal>=1.6.4,<2.0"]
observability = [
  "prometheus-client>=0.21",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  'langfuse>=5.0,<6; python_version >= "3.11"',
]

[project.scripts]
research-agent = "research_agent.cli:main"
research-eval = "evaluation.cli:main"
research-bench = "evaluation.benchmark_cli:main"
research-external = "evaluation.external.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_agent*", "research_core*", "research_observability*", "evaluation*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["research_agent", "research_core", "research_observability", "evaluation", "scripts"]


[tool.setuptools.package-data]
"evaluation.external" = ["registry.json"]
